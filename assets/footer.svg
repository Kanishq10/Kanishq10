<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="130" rx="24" fill="#090B1A"/>
  <rect x="40" y="24" width="1120" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="width" values="120;1120;120" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="82" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="22" letter-spacing="3">BUILD • LEARN • AUTOMATE • IMPROVE</text>
  <circle cx="84" cy="82" r="9" fill="#22D3EE">
    <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1116" cy="82" r="9" fill="#F472B6">
    <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
